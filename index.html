<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAFC 재고 관리 (클라우드 실시간 연동)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:sans-serif;background:#f4f6fa;min-height:100vh;padding:1.5rem;}
.app{max-width:780px;margin:0 auto;}
.topbar{background:#185FA5;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1.25rem;display:flex;align-items:center;justify-content:space-between;}
.topbar-title{color:#E6F1FB;font-size:17px;font-weight:500;display:flex;align-items:center;gap:10px;}
.topbar-date{color:#85B7EB;font-size:12px;}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.25rem;}
.sc{border-radius:8px;padding:12px 14px;}
.sc-blue{background:#E6F1FB;}.sc-green{background:#EAF3DE;}.sc-amber{background:#FAEEDA;}.sc-red{background:#FCEBEB;}
.sc-label{font-size:11px;font-weight:500;margin-bottom:4px;}
.sc-blue .sc-label{color:#185FA5;}.sc-green .sc-label{color:#3B6D11;}.sc-amber .sc-label{color:#854F0B;}.sc-red .sc-label{color:#A32D2D;}
.sc-val{font-size:22px;font-weight:500;}
.sc-blue .sc-val{color:#0C447C;}.sc-green .sc-val{color:#27500A;}.sc-amber .sc-val{color:#633806;}.sc-red .sc-val{color:#791F1F;}
.tabs{display:flex;gap:6px;margin-bottom:1.25rem;}
.tab{flex:1;padding:9px 0;text-align:center;font-size:13px;cursor:pointer;border-radius:8px;border:0.5px solid #B5D4F4;background:#E6F1FB;color:#185FA5;font-weight:500;}
.tab.active{background:#185FA5;color:#E6F1FB;border-color:#185FA5;}
.card{background:#fff;border:0.5px solid #ddd;border-radius:12px;overflow:hidden;margin-bottom:1.25rem;position:relative;}
.card-pad{padding:1rem 1.25rem;}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;}
th{padding:9px 10px;font-size:11px;font-weight:500;color:#185FA5;background:#E6F1FB;border-bottom:0.5px solid #B5D4F4;text-align:left;}
td{padding:10px;border-bottom:0.5px solid #eee;color:#222;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#E6F1FB;}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:500;}
.b-ok{background:#EAF3DE;color:#3B6D11;}
.b-warn{background:#FAEEDA;color:#854F0B;}
.b-danger{background:#FCEBEB;color:#A32D2D;}
.b-in{background:#E1F5EE;color:#085041;}
.b-out{background:#FAECE7;color:#712B13;}
.sec-title{font-size:13px;font-weight:500;color:#185FA5;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.input-row{display:flex;gap:8px;margin-bottom:10px;}
.input-row input,.input-row select{flex:1;font-size:13px;padding:8px 10px;border:0.5px solid #ccc;border-radius:8px;outline:none;}
.input-row input:focus,.input-row select:focus{border-color:#185FA5;}
.site-wrap{flex:1;position:relative;display:flex;gap:6px;}
.site-wrap select{flex:1;font-size:13px;padding:8px 10px;border:0.5px solid #ccc;border-radius:8px;outline:none;}
.site-wrap select:focus{border-color:#185FA5;}
.btn-add-site{background:#E6F1FB;color:#185FA5;border:0.5px solid #B5D4F4;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;white-space:nowrap;font-weight:500;}
.btn-add-site:hover{background:#B5D4F4;}
.btn-reg{background:#185FA5;color:#E6F1FB;border:none;border-radius:8px;padding:9px 18px;font-size:13px;cursor:pointer;white-space:nowrap;font-weight:500;}
.btn-reg:hover{background:#0C447C;}
.btn-del-site{background:#FCEBEB;color:#A32D2D;border:0.5px solid #F7C1C1;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;white-space:nowrap;}
.btn-del-site:hover{background:#F7C1C1;}
.log-row{display:flex;gap:10px;padding:10px 0;border-bottom:0.5px solid #eee;font-size:13px;align-items:center;}
.log-row:last-child{border-bottom:none;}
.log-date{color:#888;font-size:11px;min-width:76px;}
.log-site{min-width:72px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.log-item{flex:1;}
.log-qty{min-width:36px;text-align:right;font-weight:500;color:#0C447C;}
.log-note{font-size:11px;color:#888;min-width:50px;overflow:hidden;text-overflow:ellipsis;}
.btn-log-del{background:#FCEBEB;color:#A32D2D;border:0.5px solid #F7C1C1;border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;font-weight:500;white-space:nowrap;}
.btn-log-del:hover{background:#F7C1C1;}
.empty{text-align:center;padding:2rem;color:#888;font-size:13px;}
.filter-row{display:flex;gap:8px;margin-bottom:10px;}
.filter-row select{flex:1;font-size:13px;padding:8px 10px;border:0.5px solid #ccc;border-radius:8px;}
.msg-ok{color:#3B6D11;font-size:13px;margin-top:4px;}
.msg-err{color:#A32D2D;font-size:13px;margin-top:4px;}
.hidden{display:none;}
.new-site-row{display:flex;gap:6px;margin-bottom:10px;}
.new-site-row input{flex:1;font-size:13px;padding:8px 10px;border:0.5px solid #ccc;border-radius:8px;outline:none;}
.new-site-row input:focus{border-color:#185FA5;}
.site-mgmt{background:#f8fafd;border:0.5px solid #B5D4F4;border-radius:8px;padding:10px 12px;margin-bottom:10px;}
.site-mgmt-title{font-size:12px;color:#185FA5;font-weight:500;margin-bottom:8px;}
.an-filter{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.an-filter select{flex:1;min-width:120px;font-size:13px;padding:8px 10px;border:0.5px solid #ccc;border-radius:8px;outline:none;}
.an-filter select:focus{border-color:#185FA5;}
.chart-wrap{background:#fff;border:0.5px solid #ddd;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1.25rem;}
.chart-title{font-size:13px;font-weight:500;color:#185FA5;margin-bottom:12px;}
.chart-canvas{width:100%;height:240px;}
.an-table-wrap{background:#fff;border:0.5px solid #ddd;border-radius:12px;overflow:auto;margin-bottom:1.25rem;}
.an-table{width:100%;border-collapse:collapse;font-size:12px;}
.an-table th{padding:8px 10px;background:#E6F1FB;color:#185FA5;font-weight:500;border-bottom:0.5px solid #B5D4F4;text-align:center;white-space:nowrap;}
.an-table td{padding:8px 10px;border-bottom:0.5px solid #eee;text-align:center;color:#222;}
.an-table tr:last-child td{border-bottom:none;font-weight:500;background:#f8fafd;}
.an-table td:first-child{text-align:left;font-weight:500;}

.bulk-section { margin-top: 20px; border-top: 2px dashed #B5D4F4; padding-top: 20px; }
.bulk-textarea { width: 100%; height: 100px; padding: 10px; font-size: 12px; border: 1px solid #ccc; border-radius: 8px; font-family: monospace; resize: vertical; outline: none; }
.bulk-textarea:focus { border-color: #185FA5; }
.bulk-preview { max-height: 150px; overflow-y: auto; margin: 10px 0; font-size: 11px; background: #fafafa; border: 1px solid #eee; border-radius: 6px; }
.bulk-preview table { width: 100%; }
.bulk-preview th { background: #f0f4f8; padding: 6px; font-size: 11px; color: #555; }
.bulk-preview td { padding: 6px; border-bottom: 1px solid #f0f0f0; }
.btn-bulk-reg { background: #27500A; color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-size: 13px; cursor: pointer; font-weight: bold; width: 100%; }
.btn-bulk-reg:hover { background: #1b3807; }
.log-tools { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.log-filter-row-1 { display: flex; gap: 8px; width: 100%; }
.log-filter-row-2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.btn-clear-all { background: #A32D2D; color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-size: 12px; cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.btn-clear-all:hover { background: #791F1F; }

.inv-tool-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.inv-year-label { font-size: 13px; color: #185FA5; font-weight: 500; display: flex; align-items: center; gap: 4px; }
.inv-year-select { font-size: 13px; padding: 6px 12px; border: 0.5px solid #ccc; border-radius: 8px; outline: none; background: #fff; color: #222; font-weight: 500; }
.inv-year-select:focus { border-color: #185FA5; }

.cloud-bar { background: #FFF9E6; border: 1px solid #FFEBAA; color: #856404; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
.cloud-status { display: flex; align-items: center; gap: 6px; }
.btn-sync { background: #185FA5; color: #fff; border: none; border-radius: 4px; padding: 4px 8px; font-size: 11px; cursor: pointer; }
.btn-sync:hover { background: #0C447C; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-title">
      <i class="ti ti-cloud-computing" style="font-size:20px;"></i>
      PAFC 재고 관리 (클라우드 공유형)
    </div>
    <span class="topbar-date" id="today-date">-</span>
  </div>

  <div class="cloud-bar" id="cloud-bar">
    <div class="cloud-status" id="cloud-status"><i class="ti ti-cloud-lock"></i> <span>연결 상태 확인 중...</span></div>
    <button class="btn-sync" onclick="loadFromCloud()">수동 새로고침</button>
  </div>

  <div class="stats-grid" id="stats-grid">
    <div class="sc sc-blue"><div class="sc-label"><i class="ti ti-box"></i> 전체 재고</div><div class="sc-val">0</div></div>
    <div class="sc sc-green"><div class="sc-label"><i class="ti ti-circle-check"></i> 정상 품목</div><div class="sc-val">0</div></div>
    <div class="sc sc-amber"><div class="sc-label"><i class="ti ti-alert-triangle"></i> 주의 품목</div><div class="sc-val">0</div></div>
    <div class="sc sc-red"><div class="sc-label"><i class="ti ti-alert-circle"></i> 부족 품목</div><div class="sc-val">0</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('inventory')"><i class="ti ti-box"></i> 현재 재고</button>
    <button class="tab" onclick="showTab('inout')"><i class="ti ti-arrows-exchange"></i> 입출고</button>
    <button class="tab" onclick="showTab('log')"><i class="ti ti-list"></i> 이력</button>
    <button class="tab" onclick="showTab('analysis')"><i class="ti ti-chart-line"></i> 분석</button>
  </div>

  <div id="tab-inventory">
    <div class="inv-tool-bar">
      <div class="inv-year-label"><i class="ti ti-calendar-event"></i> 보기 연도 설정:</div>
      <select id="inv-year-select" class="inv-year-select" onchange="renderInv()"></select>
    </div>
    <div class="card">
      <table>
        <thead><tr>
          <th style="width:30%">품목</th>
          <th style="width:16%">현재 재고</th>
          <th style="width:18%" id="th-year-in">- 입고</th>
          <th style="width:18%" id="th-year-out">- 출고</th>
          <th style="width:18%">상태</th>
        </tr></thead>
        <tbody id="inventory-tbody"></tbody>
      </table>
    </div>
  </div>

  <div id="tab-inout" class="hidden">
    <div class="card card-pad">
      <div class="sec-title"><i class="ti ti-plus"></i> 개별 입출고 등록</div>

      <div class="input-row">
        <select id="io-type">
          <option value="out">출고</option>
          <option value="in">입고</option>
        </select>
        <select id="io-item"><option value="">품목 선택</option></select>
      </div>

      <div class="input-row" style="align-items:center;">
        <div class="site-wrap">
          <select id="io-site-sel" style="flex:1;"><option value="">현장 선택</option></select>
        </div>
        <input type="number" id="io-qty" placeholder="수량" min="1" style="flex:1;">
      </div>

      <div class="input-row">
        <input type="text" id="io-hogi" placeholder="호기 (예: 3, 5, 없으면 비워두세요)" style="flex:1;">
      </div>

      <div class="site-mgmt" id="site-mgmt-box">
        <div class="site-mgmt-title"><i class="ti ti-settings"></i> 시스템 기준 정보 관리</div>
        <div class="new-site-row" style="display: flex; gap: 5px;">
          <select id="mgmt-type-select" style="width: 90px; padding: 6px; border: 1px solid #ccc; border-radius: 8px; font-size: 13px; background:#fff;">
            <option value="site">현장</option>
            <option value="item">품목</option>
          </select>
          <input type="text" id="mgmt-input" placeholder="이름을 입력하세요" style="flex: 1;">
          <button class="btn-add-site" onclick="handleMgmtAdd()"><i class="ti ti-plus"></i> 추가</button>
          <button class="btn-del-site" onclick="handleMgmtDel()"><i class="ti ti-trash"></i> 삭제</button>
        </div>
      </div>

      <div class="input-row">
        <input type="text" id="io-date" placeholder="날짜 (예: 2026-05-20)" style="flex:1;">
      </div>
      <div class="input-row">
        <input type="text" id="io-note" placeholder="비고 (선택)">
        <button class="btn-reg" id="btn-reg-io" onclick="registerIO()"><i class="ti ti-check"></i> 등록</button>
      </div>
      <div id="io-msg"></div>

      <div class="bulk-section">
        <div class="sec-title" style="color: #27500A;"><i class="ti ti-file-spreadsheet"></i> 엑셀 대량 붙여넣기 등록</div>
        <p style="font-size:11px; color:#666; margin-bottom:8px;">
          엑셀에서 <b>[ 날짜 | 현장명 | 호기 | 품목명 | 수량 ]</b> 순서로 범위를 복사(Ctrl+C) 후 아래에 붙여넣기(Ctrl+V) 하세요.
        </p>
        <textarea id="bulk-paste-area" class="bulk-textarea" placeholder="여기에 엑셀 데이터를 붙여넣으세요..." oninput="previewBulkData()"></textarea>
        
        <div id="bulk-preview-wrap" class="bulk-preview hidden">
          <table>
            <thead>
              <tr><th>구분</th><th>날짜</th><th>현장명</th><th>호기</th><th>품목명</th><th>수량</th></tr>
            </thead>
            <tbody id="bulk-preview-tbody"></tbody>
          </table>
        </div>
        
        <div style="margin-top:10px;">
          <button class="btn-bulk-reg" id="btn-bulk-reg-io" onclick="registerBulk()"><i class="ti ti-table-import"></i> 대량 등록 실행 (<span id="bulk-count">0</span>건)</button>
        </div>
        <div id="bulk-msg"></div>
      </div>
    </div>
  </div>

  <div id="tab-log" class="hidden">
    <div class="log-tools">
      <div class="log-filter-row-1">
        <select id="log-filter-site" onchange="renderLog()"><option value="">전체 현장</option></select>
        <select id="log-filter-item" onchange="renderLog()"><option value="">전체 품목</option></select>
        <select id="log-filter-type" onchange="renderLog()">
          <option value="">전체 입출고</option>
          <option value="in">입고만</option>
          <option value="out">출고만</option>
        </select>
      </div>
      <div class="log-filter-row-2">
        <select id="log-sort-order" onchange="renderLog()" style="font-size:13px; padding:8px 10px; border:0.5px solid #ccc; border-radius:8px; flex:1; max-width:200px;">
          <option value="desc">날짜 최신순 (내림차순)</option>
          <option value="asc">날짜 과거순 (오름차순)</option>
        </select>
        <button class="btn-clear-all" onclick="clearAllLogs()"><i class="ti ti-trash-x"></i> 이력 전체 삭제</button>
      </div>
    </div>
    
    <div class="card" style="padding:0 12px; max-height: 600px; overflow-y: auto;">
      <div id="log-list"></div>
    </div>
  </div>

  <div id="tab-analysis" class="hidden">
    <div class="an-filter">
      <select id="an-year" onchange="renderAnalysis()"></select>
      <select id="an-site" onchange="renderAnalysis()"><option value="">전체 현장</option></select>
      <select id="an-item" onchange="renderAnalysis()"><option value="">전체 품목</option></select>
    </div>

    <div class="chart-wrap">
      <div class="chart-title" id="chart-title">월별 출고 추이</div>
      <div style="position:relative; height:240px; width:100%;">
        <canvas id="analyticsChart" class="chart-canvas"></canvas>
      </div>
    </div>

    <div class="an-table-wrap">
      <table class="an-table" id="an-table"></table>
    </div>
  </div>
</div>

<script>
// 🌟 대리님의 Apps Script 배포 URL (기존 주소 완벽 유지)
const GOOGLE_WEB_APP_URL = "https://script.google.com/shortcuts/s/AKfycbzSdfv1t8ZiswB_vYt8v7yD-v_q0w6N2bXUfHpx9I1T_mN_pA_UvU2p_1ZzQ8x_O9w/exec";

let logs = [];
let sites = ['미래개발원', 'kt대관령수련관', '유일산업', '겐지스사우나', '한사랑사우나', '아쿠아시티', '두류수영장', '선비사우나', '중구수영장', '그린파크', '천호사우나', '안양데이터센터', '마포공덕역오피스텔', 'KT대관령수련관', '공덕역 오피스텔', '다모테크'];
let items = ['레진(후지전기)', '레진(삼양사)', '물필터', '레진헤드', '집수봉', '활성탄필터', '마이크로필터', '인버터필터', '개질기필터', 'GS-23', 'GS-6', '방열팬'];
let chartInstance = null;

window.onload = function() {
  const d = new Date();
  document.getElementById('today-date').innerText = `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`;
  document.getElementById('io-date').value = d.toISOString().split('T')[0];
  loadFromCloud();
};

// 💡 시스템 기준정보 통합 관리 (추가 기능)
async function handleMgmtAdd() {
  const type = document.getElementById('mgmt-type-select').value;
  const input = document.getElementById('mgmt-input');
  const name = input.value.trim();
  
  if(!name) { alert('등록할 이름을 입력하세요.'); return; }

  if(type === 'site') {
    if(sites.includes(name)){ alert('이미 존재하는 현장입니다.'); return; }
    sites.push(name);
    renderSiteSel();
    if(document.getElementById('io-site-sel')) document.getElementById('io-site-sel').value = name;
  } else {
    if(items.includes(name)){ alert('이미 존재하는 품목입니다.'); return; }
    items.push(name);
    renderItemSel(); 
    renderInv();     
    if(document.getElementById('io-item')) document.getElementById('io-item').value = name;
  }

  input.value = '';
  await saveToCloud(); 
}

// 💡 시스템 기준정보 통합 관리 (삭제 기능)
async function handleMgmtDel() {
  const type = document.getElementById('mgmt-type-select').value;
  
  if(type === 'site') {
    const sel = document.getElementById('io-site-sel');
    const name = sel ? sel.value : "";
    if(!name){ alert('우측 입출고 등록 창의 [현장 선택]에서 삭제할 현장을 먼저 지정해 주세요.'); return; }
    if(!confirm(`"${name}" 현장을 시스템에서 삭제하시겠습니까?`)) return;
    
    sites = sites.filter(s => s !== name);
    renderSiteSel();
    if(document.getElementById('io-site-sel')) document.getElementById('io-site-sel').value = '';
  } else {
    const sel = document.getElementById('io-item');
    const name = sel ? sel.value : "";
    if(!name){ alert('우측 입출고 등록 창의 [품목 선택]에서 삭제할 품목을 먼저 지정해 주세요.'); return; }
    if(!confirm(`"${name}" 품목을 시스템에서 제외하시겠습니까?\n(기존 누적 입출고 이력 데이터는 정상 보존됩니다.)`)) return;

    items = items.filter(i => i !== name);
    renderItemSel();
    renderInv(); 
    if(document.getElementById('io-item')) document.getElementById('io-item').value = '';
  }

  await saveToCloud(); 
}

// 💡 동적 품목 마스터 드롭다운 동기화 렌더링
function renderItemSel(){
  const ioItem = document.getElementById('io-item');
  const logItem = document.getElementById('log-filter-item');
  const anItem = document.getElementById('an-item');

  const prevIo = ioItem ? ioItem.value : "";
  const prevLog = logItem ? logItem.value : "";
  const prevAn = anItem ? anItem.value : "";

  if(ioItem) ioItem.innerHTML = '<option value="">품목 선택</option>';
  if(logItem) logItem.innerHTML = '<option value="">전체 품목</option>';
  if(anItem) anItem.innerHTML = '<option value="">전체 품목</option>';

  items.forEach(item => {
    if(ioItem) ioItem.innerHTML += `<option value="${item}">${item}</option>`;
    if(logItem) logItem.innerHTML += `<option value="${item}">${item}</option>`;
    if(anItem) anItem.innerHTML += `<option value="${item}">${item}</option>`;
  });

  if(prevIo && items.includes(prevIo)) ioItem.value = prevIo;
  if(prevLog && items.includes(prevLog)) logItem.value = prevLog;
  if(prevAn && items.includes(prevAn)) anItem.value = prevAn;
}

function renderInv() {
  const tbody = document.getElementById('inventory-tbody');
  const yearSelect = document.getElementById('inv-year-select');
  if(!yearSelect || !yearSelect.value) return;
  const year = yearSelect.value;
  
  document.getElementById('th-year-in').innerText = `${year} 입고`;
  document.getElementById('th-year-out').innerText = `${year} 출고`;
  
  const baseItems = items; // 동적 변수로 연동 완료
  
  let totalStockAll = 0;
  let dangerCount = 0;
  let warnCount = 0;
  let okCount = 0;
  
  let html = '';
  baseItems.forEach(item => {
    let totalIn = 0;
    let totalOut = 0;
    let yearIn = 0;
    let yearOut = 0;
    
    logs.forEach(log => {
      if(log.item === item) {
        const qty = parseInt(log.qty) || 0;
        if(log.type === 'in') {
          totalIn += qty;
          if(log.date.startsWith(year)) yearIn += qty;
        } else {
          totalOut += qty;
          if(log.date.startsWith(year)) yearOut += qty;
        }
      }
    });
    
    const currentStock = totalIn - totalOut;
    totalStockAll += currentStock;
    
    let badge = '<span class="badge b-ok">정상</span>';
    if(currentStock < 0) {
      badge = '<span class="badge b-danger">부족</span>';
      dangerCount++;
    } else if(currentStock <= 2) {
      badge = '<span class="badge b-warn">주의</span>';
      warnCount++;
    } else {
      okCount++;
    }
    
    html += `<tr>
      <td style="font-weight:500">${item}</td>
      <td style="font-weight:500;color:#0C447C">${currentStock}</td>
      <td style="color:#222; font-weight: 500;">${yearIn}</td>
      <td style="color:#666">${yearOut}</td>
      <td>${badge}</td>
    </tr>`;
  });
  
  tbody.innerHTML = html;
  
  const grid = document.getElementById('stats-grid');
  grid.innerHTML = `
    <div class="sc sc-blue"><div class="sc-label"><i class="ti ti-box"></i> 전체 재고</div><div class="sc-val">${totalStockAll}</div></div>
    <div class="sc sc-green"><div class="sc-label"><i class="ti ti-circle-check"></i> 정상 품목</div><div class="sc-val">${okCount}</div></div>
    <div class="sc sc-amber"><div class="sc-label"><i class="ti ti-alert-triangle"></i> 주의 품목</div><div class="sc-val">${warnCount}</div></div>
    <div class="sc sc-red"><div class="sc-label"><i class="ti ti-alert-circle"></i> 부족 품목</div><div class="sc-val">${dangerCount}</div></div>
  `;
}

function renderSiteSel(){
  const ioSite = document.getElementById('io-site-sel');
  const logSite = document.getElementById('log-filter-site');
  const anSite = document.getElementById('an-site');
  
  const prevIo = ioSite ? ioSite.value : "";
  const prevLog = logSite ? logSite.value : "";
  const prevAn = anSite ? anSite.value : "";
  
  if(ioSite) ioSite.innerHTML = '<option value="">현장 선택</option>';
  if(logSite) logSite.innerHTML = '<option value="">전체 현장</option>';
  if(anSite) anSite.innerHTML = '<option value="">전체 현장</option>';
  
  sites.forEach(s => {
    if(ioSite) ioSite.innerHTML += `<option value="${s}">${s}</option>`;
    if(logSite) logSite.innerHTML += `<option value="${s}">${s}</option>`;
    if(anSite) anSite.innerHTML += `<option value="${s}">${s}</option>`;
  });
  
  if(prevIo && sites.includes(prevIo)) ioSite.value = prevIo;
  if(prevLog && sites.includes(prevLog)) logSite.value = prevLog;
  if(prevAn && sites.includes(prevAn)) anSite.value = prevAn;
}

function populateSels() {
  renderSiteSel();
  renderItemSel();
}

function updateYearSelectOptions() {
  const years = new Set([new Date().getFullYear().toString()]);
  logs.forEach(log => {
    if(log.date && log.date.length >= 4) {
      const y = log.date.substring(0,4);
      if(!isNaN(y)) years.add(y);
    }
  });
  
  const sorted = Array.from(years).sort((a,b)=>b-a);
  
  const invSel = document.getElementById('inv-year-select');
  const anSel = document.getElementById('an-year');
  
  const prevInv = invSel ? invSel.value : "";
  const prevAn = anSel ? anSel.value : "";
  
  if(invSel) {
    invSel.innerHTML = sorted.map(y=>`<option value="${y}">${y}년</option>`).join('');
    if(prevInv && sorted.includes(prevInv)) invSel.value = prevInv;
  }
  if(anSel) {
    anSel.innerHTML = sorted.map(y=>`<option value="${y}">${y}년</option>`).join('');
    if(prevAn && sorted.includes(prevAn)) anSel.value = prevAn;
  }
}

async function loadFromCloud() {
  const bar = document.getElementById('cloud-bar');
  const status = document.getElementById('cloud-status');
  bar.style.background = '#FFF9E6'; bar.style.borderColor = '#FFEBAA';
  status.style.color = '#856404'; status.innerHTML = '<i class="ti ti-refresh rotating"></i> <span>클라우드 동기화 중...</span>';
  
  try {
    const res = await fetch(GOOGLE_WEB_APP_URL);
    const data = await res.json();
    if(data.logs) logs = data.logs;
    if(data.sites) sites = data.sites;
    if(data.items && data.items.length > 0) items = data.items;
    
    updateYearSelectOptions();
    populateSels();
    renderInv();
    renderLog();
    renderAnalysis();
    
    bar.style.background = '#EAF3DE'; bar.style.borderColor = '#C1E09D';
    status.style.color = '#3B6D11'; status.innerHTML = '<i class="ti ti-cloud-lock"></i> <span>✓ 실시간 클라우드 연결 완료 (안전)</span>';
  } catch (e) {
    bar.style.background = '#FCEBEB'; bar.style.borderColor = '#F7C1C1';
    status.style.color = '#A32D2D'; status.innerHTML = '<i class="ti ti-cloud-off"></i> <span>❌ 클라우드 연결 실패 (로컬 모드)</span>';
  }
}

async function saveToCloud() {
  const bar = document.getElementById('cloud-bar');
  const status = document.getElementById('cloud-status');
  bar.style.background = '#FFF9E6'; bar.style.borderColor = '#FFEBAA';
  status.style.color = '#856404'; status.innerHTML = '<i class="ti ti-cloud-upload"></i> <span>변경사항 클라우드 백업 중...</span>';
  
  try {
    const payload = { logs: logs, sites: sites, items: items };
    await fetch(GOOGLE_WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify(payload),
      headers: { "Content-Type": "text/plain" }
    });
    bar.style.background = '#EAF3DE'; bar.style.borderColor = '#C1E09D';
    status.style.color = '#3B6D11'; status.innerHTML = '<i class="ti ti-cloud-lock"></i> <span>✓ 변경사항 클라우드 저장 완료</span>';
  } catch(e) {
    bar.style.background = '#FCEBEB'; bar.style.borderColor = '#F7C1C1';
    status.style.color = '#A32D2D'; status.innerHTML = '<i class="ti ti-cloud-off"></i> <span>❌ 저장 실패 (네트워크를 확인하세요)</span>';
  }
}

function registerIO() {
  const type = document.getElementById('io-type').value;
  const item = document.getElementById('io-item').value;
  const siteSel = document.getElementById('io-site-sel').value;
  const qty = parseInt(document.getElementById('io-qty').value);
  const hoge = document.getElementById('io-hogi').value.trim();
  const date = document.getElementById('io-date').value.trim();
  const note = document.getElementById('io-note').value.trim();
  const msg = document.getElementById('io-msg');
  
  if(!item || !siteSel || !qty || !date) {
    msg.className = 'msg-err'; msg.innerText = '⚠️ 필수 항목(품목, 현장, 수량, 날짜)을 모두 입력하세요.'; return;
  }
  
  const siteStr = hoge ? `${siteSel} ${hoge}호기` : siteSel;
  const id = `${Date.now()}-${Math.floor(Math.random()*100000)}-${logs.length}`;
  
  logs.unshift({ id, date, type, site: siteStr, item, qty, note });
  
  msg.className = 'msg-ok'; msg.innerText = '✓ 성공적으로 등록되었습니다.';
  document.getElementById('io-qty').value = '';
  document.getElementById('io-hogi').value = '';
  document.getElementById('io-note').value = '';
  
  updateYearSelectOptions();
  renderInv();
  renderLog();
  renderAnalysis();
  saveToCloud();
}

function renderLog() {
  const list = document.getElementById('log-list');
  const fSite = document.getElementById('log-filter-site').value;
  const fItem = document.getElementById('log-filter-item').value;
  const fType = document.getElementById('log-filter-type').value;
  const order = document.getElementById('log-sort-order').value;
  
  let filtered = logs.filter(log => {
    if(fSite && !log.site.includes(fSite)) return false;
    if(fItem && log.item !== fItem) return false;
    if(fType && log.type !== fType) return false;
    return true;
  });
  
  filtered.sort((a,b) => {
    return order === 'desc' ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date);
  });
  
  if(filtered.length === 0) {
    list.innerHTML = '<div class="empty">조건에 맞는 입출고 이력이 없습니다.</div>'; return;
  }
  
  list.innerHTML = filtered.map(log => `
    <div class="log-row">
      <span class="log-date">${log.date}</span>
      <span class="badge ${log.type==='in'?'b-in':'b-out'}">${log.type==='in'?'입고':'출고'}</span>
      <span class="log-site">${log.site}</span>
      <span class="log-item">${log.item}</span>
      <span class="log-qty">${log.qty}개</span>
      <span class="log-note">${log.note||'-'}</span>
      <button class="btn-log-del" onclick="deleteLog('${log.id}')">삭제</button>
    </div>
  `).join('');
}

async function deleteLog(id) {
  if(!confirm('해당 이력을 시스템에서 영구 삭제하시겠습니까?')) return;
  logs = logs.filter(l => l.id !== id);
  updateYearSelectOptions();
  renderInv();
  renderLog();
  renderAnalysis();
  await saveToCloud();
}

async function clearAllLogs() {
  if(!confirm('⚠️ 경고: 시스템에 누적된 전체 입출고 데이터가 초기화됩니다.\n정말 전체 삭제하시겠습니까?')) return;
  logs = [];
  updateYearSelectOptions();
  renderInv();
  renderLog();
  renderAnalysis();
  await saveToCloud();
}

function previewBulkData() {
  const text = document.getElementById('bulk-paste-area').value;
  const tbody = document.getElementById('bulk-preview-tbody');
  const countSpan = document.getElementById('bulk-count');
  const wrap = document.getElementById('bulk-preview-wrap');
  
  if(!text.trim()) { wrap.classList.add('hidden'); countSpan.innerText='0'; return; }
  
  const lines = text.split('\n').filter(l=>l.trim());
  let count = 0;
  let html = '';
  
  lines.forEach(line => {
    const tokens = line.split('\t').map(t=>t.trim());
    if(tokens.length >= 4) {
      count++;
      let date = tokens[0] || '-';
      let site = tokens[1] || '-';
      let hoge = tokens[2] || '';
      let item = tokens[3] || '-';
      let qty = tokens[4] || '1';
      
      let type = '출고';
      if(qty.includes('-') || parseInt(qty) < 0) {
        type = '출고';
        qty = Math.abs(parseInt(qty)).toString();
      } else if(site.includes('이월') || site.includes('창고') || site.includes('본사')) {
        type = '입고';
      }
      
      const siteStr = hoge ? `${site} ${hoge}호기` : site;
      html += `<tr>
        <td><span class="badge ${type==='입고'?'b-in':'b-out'}">${type}</span></td>
        <td>${date}</td><td>${siteStr}</td><td>${hoge||'-'}</td><td>${item}</td><td>${qty}개</td>
      </tr>`;
    }
  });
  
  tbody.innerHTML = html;
  countSpan.innerText = count.toString();
  if(count > 0) wrap.classList.remove('hidden');
  else wrap.classList.add('hidden');
}

async function registerBulk() {
  const text = document.getElementById('bulk-paste-area').value;
  const msg = document.getElementById('bulk-msg');
  if(!text.trim()) { alert('붙여넣은 데이터가 없습니다.'); return; }
  
  const lines = text.split('\n').filter(l=>l.trim());
  let successCount = 0;
  
  lines.forEach(line => {
    const tokens = line.split('\t').map(t=>t.trim());
    if(tokens.length >= 4) {
      let date = tokens[0];
      let site = tokens[1];
      let hoge = tokens[2];
      let item = tokens[3];
      let qty = parseInt(tokens[4]) || 1;
      
      let type = 'out';
      if(qty < 0) {
        type = 'out';
        qty = Math.abs(qty);
      } else if(site.includes('이월') || site.includes('창고') || site.includes('본사')) {
        type = 'in';
      }
      
      const siteStr = hoge ? `${site} ${hoge}호기` : site;
      const id = `${Date.now()}-${Math.floor(Math.random()*100000)}-${logs.length}`;
      
      logs.unshift({ id, date, type, site: siteStr, item, qty, note: '엑셀 일괄등록' });
      successCount++;
    }
  });
  
  msg.className = 'msg-ok'; msg.innerText = `✓ 엑셀 데이터 ${successCount}건이 일괄 등록 완료되었습니다.`;
  document.getElementById('bulk-paste-area').value = '';
  document.getElementById('bulk-preview-wrap').classList.add('hidden');
  document.getElementById('bulk-count').innerText = '0';
  
  updateYearSelectOptions();
  renderInv();
  renderLog();
  renderAnalysis();
  await saveToCloud();
}

function renderAnalysis() {
  const yearSelect = document.getElementById('an-year');
  if(!yearSelect || !yearSelect.value) return;
  const year = yearSelect.value;
  const fSite = document.getElementById('an-site').value;
  const fItem = document.getElementById('an-item').value;
  
  let monthlyOut = Array(12).fill(0);
  let siteMap = {};
  let itemMap = {};
  
  logs.forEach(log => {
    if(log.type === 'out' && log.date.startsWith(year)) {
      if(fSite && !log.site.includes(fSite)) return;
      if(fItem && log.item !== fItem) return;
      
      const m = parseInt(log.date.split('-')[1]) - 1;
      if(m >= 0 && m < 12) monthlyOut[m] += log.qty;
      
      const sBase = log.site.split(' ')[0];
      siteMap[sBase] = (siteMap[sBase]||0) + log.qty;
      itemMap[log.item] = (itemMap[log.item]||0) + log.qty;
    }
  });
  
  drawChart(monthlyOut);
  
  if(fSite) {
    document.getElementById('chart-title').innerText = `[${fSite}] 품목별 누적 출고 비율 (${year}년)`;
    drawItemTable(itemMap, items);
  } else if(fItem) {
    document.getElementById('chart-title').innerText = `[${fItem}] 현장별 누적 출고 비율 (${year}년)`;
    drawSiteTable(siteMap, sites);
  } else {
    document.getElementById('chart-title').innerText = `월별 자재 통합 출고 추이 (${year}년)`;
    drawMatrixTable(year);
  }
}

function drawChart(dataArray) {
  const ctx = document.getElementById('analyticsChart');
  if(!ctx) return;
  
  if(chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'],
      datasets: [{ label: '출고 수량', data: dataArray, backgroundColor: '#185FA5', borderRadius: 4 }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
  });
}

function drawMatrixTable(year) {
  const baseItems = items;
  let tHead = `<tr><th>품목명</th>${Array.from({length:12},(_,i)=>`<th>${i+1}월</th>`).join('')}<th>합계</th></tr>`;
  
  let tBody = baseItems.map(item => {
    let mQty = Array(12).fill(0);
    logs.forEach(log => {
      if(log.item === item && log.type === 'out' && log.date.startsWith(year)) {
        const m = parseInt(log.date.split('-')[1]) - 1;
        if(m >= 0 && m < 12) mQty[m] += log.qty;
      }
    });
    const sum = mQty.reduce((a,v)=>a+v,0);
    return `<tr><td>${item}</td>${mQty.map(v=>`<td>${v||'-'}</td>`).join('')}<td style="font-weight:bold;color:#185FA5;">${sum||0}</td></tr>`;
  });
  
  document.getElementById('an-table').innerHTML = `<thead>${tHead}</thead><tbody>${tBody.join('')}</tbody>`;
}

function drawSiteTable(map, labels){
  const total = labels.reduce((a,k)=>a+(map[k]||0),0);
  const rows = labels.filter(k=>map[k]).map(k=>`<tr><td>${k}</td><td>${map[k]}개</td><td>${total?Math.round(map[k]/total*100):0}%</td></tr>`);
  document.getElementById('an-table').innerHTML=`<thead><tr><th>현장</th><th>출고량</th><th>비율</th></tr></thead><tbody>${rows.length?rows.join(''):'<tr><td colspan="3" class="empty">출고 이력이 없습니다.</td></tr>'}</tbody>`;
}

function drawItemTable(map, labels){
  const total = labels.reduce((a,k)=>a+(map[k]||0),0);
  const rows = labels.filter(k=>map[k]).map(k=>`<tr><td>${k}</td><td>${map[k]}개</td><td>${total?Math.round(map[k]/total*100):0}%</td></tr>`);
  document.getElementById('an-table').innerHTML=`<thead><tr><th>품목</th><th>출고량</th><th>비율</th></tr></thead><tbody>${rows.length?rows.join(''):'<tr><td colspan="3" class="empty">출고 이력이 없습니다.</td></tr>'}</tbody>`;
}

function showTab(tab){
  ['inventory','inout','log','analysis'].forEach(t=>{ document.getElementById('tab-'+t).classList.toggle('hidden', t!==tab); });
  document.querySelectorAll('.tab').forEach((el,i)=>{ el.classList.toggle('active',['inventory','inout','log','analysis'][i]===tab); });
  if(tab==='inventory') { renderInv(); }
  if(tab==='inout') { populateSels(); }
  if(tab==='log') { renderLog(); }
  if(tab==='analysis') { renderAnalysis(); }
}
